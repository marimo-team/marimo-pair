name: Prepare release PR
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable X.Y.Z version or patch, minor, major
        type: string
        required: true
permissions: {}
concurrency:
  group: prepare-release-pr
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Prepare versions
        id: version
        uses: marimo-team/internal-gh-actions/prepare-release@SHARED_SHA
        with:
          version: ${{ inputs.version }}
      - name: Open release PR
        id: pr
        uses: marimo-team/internal-gh-actions/release-pr@SHARED_SHA
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          current-version: ${{ steps.version.outputs.current-version }}
          manifest: ${{ steps.version.outputs.manifest }}
          version: ${{ steps.version.outputs.version }}
          files: ${{ steps.version.outputs.files }}
      - name: Link release PR
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          echo "$PR_URL" >> "$GITHUB_STEP_SUMMARY"
